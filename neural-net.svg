<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .l{stroke:url(#g);stroke-width:1.2;opacity:.45;stroke-dasharray:6 6;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-24}}
      .n{fill:#0f172a;stroke:url(#g);stroke-width:2.5;animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{0%,100%{transform:scale(1);fill:#0f172a}50%{transform:scale(1.35);fill:#ec4899}}
      text{font-family:monospace;font-size:13px;fill:#a78bfa}
    </style>
  </defs>
  <!-- connections -->
  <g class="l-group">
    <!-- input -> hidden1 -->
    <g stroke-linecap="round">
      <line class="l" x1="120" y1="50"  x2="300" y2="40"/><line class="l" x1="120" y1="50"  x2="300" y2="110"/><line class="l" x1="120" y1="50"  x2="300" y2="180"/>
      <line class="l" x1="120" y1="110" x2="300" y2="40"/><line class="l" x1="120" y1="110" x2="300" y2="110"/><line class="l" x1="120" y1="110" x2="300" y2="180"/>
      <line class="l" x1="120" y1="170" x2="300" y2="40"/><line class="l" x1="120" y1="170" x2="300" y2="110"/><line class="l" x1="120" y1="170" x2="300" y2="180"/>
      <!-- hidden1 -> hidden2 -->
      <line class="l" x1="300" y1="40"  x2="500" y2="60"/><line class="l" x1="300" y1="40"  x2="500" y2="160"/>
      <line class="l" x1="300" y1="110" x2="500" y2="60"/><line class="l" x1="300" y1="110" x2="500" y2="160"/>
      <line class="l" x1="300" y1="180" x2="500" y2="60"/><line class="l" x1="300" y1="180" x2="500" y2="160"/>
      <!-- hidden2 -> output -->
      <line class="l" x1="500" y1="60"  x2="680" y2="110"/><line class="l" x1="500" y1="160" x2="680" y2="110"/>
    </g>
  </g>
  <!-- nodes -->
  <circle class="n" cx="120" cy="50"  r="11" style="animation-delay:0s"/>
  <circle class="n" cx="120" cy="110" r="11" style="animation-delay:.2s"/>
  <circle class="n" cx="120" cy="170" r="11" style="animation-delay:.4s"/>
  <circle class="n" cx="300" cy="40"  r="11" style="animation-delay:.6s"/>
  <circle class="n" cx="300" cy="110" r="11" style="animation-delay:.8s"/>
  <circle class="n" cx="300" cy="180" r="11" style="animation-delay:1s"/>
  <circle class="n" cx="500" cy="60"  r="11" style="animation-delay:1.2s"/>
  <circle class="n" cx="500" cy="160" r="11" style="animation-delay:1.4s"/>
  <circle class="n" cx="680" cy="110" r="14" style="animation-delay:1.7s"/>
  <text x="85"  y="212">input</text>
  <text x="255" y="212">hidden</text>
  <text x="455" y="212">hidden</text>
  <text x="640" y="212">prediction</text>
</svg>
